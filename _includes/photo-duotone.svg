{% comment %}
  Gold and grey duotone for member photos. Any photo dropped into
  assets/members/ is shown through this filter (see .member-hero__photo and
  .avatar in _sass/_luxe.scss), so uploads need no editing.
  Shadows and mid-tones map to grey, highlights to gold.
{% endcomment %}
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="duotone-gold" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.05 0.24 0.46 0.79 0.93"/>
      <feFuncG type="table" tableValues="0.05 0.24 0.45 0.66 0.87"/>
      <feFuncB type="table" tableValues="0.06 0.25 0.44 0.40 0.70"/>
    </feComponentTransfer>
  </filter>
</svg>
