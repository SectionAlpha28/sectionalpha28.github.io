{% comment %}
  Gold and grey duotone for member photos. Any photo dropped into
  assets/members/ is shown through this filter (see .member-hero__photo and
  .avatar in _sass/_luxe.scss), so uploads need no editing.
  "Bright gold": a contrast boost, then near-black shadows, gold mid-tones and
  bright gold highlights. The profile photo also gets a vignette in CSS.
{% endcomment %}
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="duotone-gold" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="1.15" intercept="-0.075"/>
      <feFuncG type="linear" slope="1.15" intercept="-0.075"/>
      <feFuncB type="linear" slope="1.15" intercept="-0.075"/>
    </feComponentTransfer>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.04 0.12 0.55 0.93 1.0"/>
      <feFuncG type="table" tableValues="0.04 0.10 0.43 0.76 0.93"/>
      <feFuncB type="table" tableValues="0.05 0.08 0.15 0.30 0.62"/>
    </feComponentTransfer>
  </filter>
</svg>
